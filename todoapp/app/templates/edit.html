{% extends "base.html" %}

{% block content %}
<form action="{{ url_for('todos.edit', todo_id=todo.id) }}" method="POST">
    <input type="text" name="title" value="{{ todo.title }}" required>
    <input type="text" name="description" value="{{ todo.description or '' }}">
    <button type="submit">Actualizar</button>
    <a href="{{ url_for('todos.index') }}">Cancelar</a>
</form>
{% endblock %}
