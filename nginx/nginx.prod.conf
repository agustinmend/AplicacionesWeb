
upstream flask_app {
    server flask:5000;
}

upstream django_app {
    server django:8001;
}

# Flask: carta.jamu2-app.duckdns.org
server {
    listen 80;
    server_name carta.jamu2-app.duckdns.org;

    server_tokens off;

    # Validación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Archivos estáticos de Flask
    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://flask_app;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# Django: admin.jamu2-app.duckdns.org
server {
    listen 80;
    server_name admin.jamu2-app.duckdns.org;

    server_tokens off;

    # Validación de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Estáticos del administrador Django
    location /static/ {
        alias /django_static/;
    }

    location / {
        proxy_pass http://django_app;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
