upstream flask_app {
    server flask:5000;
}

upstream django_app {
    server django:8001;
}

# HTTP: permite validar certificados y redirige a HTTPS
server {
    listen 80;
    server_name carta.jamu2-app.duckdns.org admin.jamu2-app.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: aplicación Flask
server {
    listen 443 ssl;
    server_name carta.jamu2-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/carta.jamu2-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carta.jamu2-app.duckdns.org/privkey.pem;

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: administración Django
server {
    listen 443 ssl;
    server_name admin.jamu2-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/carta.jamu2-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carta.jamu2-app.duckdns.org/privkey.pem;

    location /static/ {
        alias /django_static/;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}