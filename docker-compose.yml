services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: restaurant_database
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacarta"]
      interval: 5s
      retries: 10
  web:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/restaurant_database
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
volumes:
  datos_pg: